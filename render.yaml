services:
  - type: web
    name: personal-ai-assistant-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        sync: false
      - key: MCP_HEADER_ENCRYPTION_KEY
        sync: false
      - key: MCP_SERVERS
        sync: false
      - key: AUTH_SESSION_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: personal-ai-assistant-db
          property: connectionString
      - key: JOB_MAX_RETRIES
        value: "3"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: personal-ai-assistant-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: personal-ai-assistant-db
    databaseName: personal_ai_assistant
    region: singapore
    plan: free
